---
- name: Deploy Minecraft Server (Robust Restic Edition)
  hosts: game_server
  become: true

  pre_tasks:
    - name: Load secret variables
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files:
            - vault.yml
            - env.yml
          paths:
            - "{{ playbook_dir }}"
      no_log: true

  vars:
    ansible_user: "debian"
    ansible_python_interpreter: /usr/bin/python3
    proxmox_ssh_key_path: "{{ ansible_ssh_private_key_file | default('~/.ssh/proxmox') }}"

    mc_root_dir: "/home/{{ ansible_user }}/minecraft"
    proxmox_host_ip: "192.168.1.12"

    restic_repo: "sftp:root@{{ proxmox_host_ip }}:/mnt/pve/minecraft_restic"
    sftp_args: "-o sftp.command='ssh -i /home/{{ ansible_user }}/.ssh/id_rsa root@{{ proxmox_host_ip }} -s sftp'"
    
    # Version pinpointed for manual install
    neoforge_ver: "21.1.219"

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        # Added default-jre-headless to ensure the host can run the installer jar
        name: [rsync, sshpass, python3-cryptography, cron, restic, default-jre-headless]
        state: present
        update_cache: true

    - name: Set Timezone to US Central
      community.general.timezone:
        name: America/Chicago

    - name: Add debian user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Generate SSH key for the VM
      community.crypto.openssh_keypair:
        path: "/home/{{ ansible_user }}/.ssh/id_rsa"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
        type: ed25519
      register: vm_ssh_key
      become_user: "{{ ansible_user }}"

    - name: Add Proxmox host key for local SSH operations
      ansible.builtin.known_hosts:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
        name: "{{ proxmox_host_ip }}"
        key: "{{ lookup('ansible.builtin.pipe', 'ssh-keyscan -H ' ~ proxmox_host_ip ~ ' 2>/dev/null') }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Add Proxmox host key for restic SSH transport
      ansible.builtin.known_hosts:
        path: "/home/{{ ansible_user }}/.ssh/known_hosts"
        name: "{{ proxmox_host_ip }}"
        key: "{{ lookup('ansible.builtin.pipe', 'ssh-keyscan -H ' ~ proxmox_host_ip ~ ' 2>/dev/null') }}"
      become_user: "{{ ansible_user }}"

    - name: Authorize VM key on Proxmox Host
      ansible.builtin.shell: |
        ssh -i {{ proxmox_ssh_key_path }} -o BatchMode=yes root@{{ proxmox_host_ip }} "mkdir -p ~/.ssh && grep -qF '{{ vm_ssh_key.public_key }}' ~/.ssh/authorized_keys || echo '{{ vm_ssh_key.public_key }}' >> ~/.ssh/authorized_keys"
      delegate_to: localhost
      become: false

    - name: Initialize Restic Repo
      ansible.builtin.shell:
        cmd: "restic {{ sftp_args }} -r {{ restic_repo }} init"
      environment:
        RESTIC_PASSWORD: "{{ restic_pw }}"
      register: restic_init
      become_user: "{{ ansible_user }}"
      failed_when:
        - restic_init.rc != 0
        - "'config file already exists' not in restic_init.stderr"
        - "'config file already exists' not in restic_init.stdout"
      changed_when: "'created restic repository' in restic_init.stdout"
      no_log: true

    - name: Create Minecraft Directory
      ansible.builtin.file:
        path: "{{ mc_root_dir }}/data"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Ensure RCON is enabled in server.properties
      ansible.builtin.lineinfile:
        path: "{{ mc_root_dir }}/data/server.properties"
        regexp: '^enable-rcon='
        line: 'enable-rcon=true'
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Ensure RCON port is set in server.properties
      ansible.builtin.lineinfile:
        path: "{{ mc_root_dir }}/data/server.properties"
        regexp: '^rcon.port='
        line: 'rcon.port=25575'
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Ensure RCON password is set in server.properties
      ansible.builtin.lineinfile:
        path: "{{ mc_root_dir }}/data/server.properties"
        regexp: '^rcon.password='
        line: "rcon.password={{ rcon_password }}"
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      no_log: true

    # --- MANUAL NEOFORGE INSTALLATION ---
    - name: Download NeoForge Installer
      ansible.builtin.get_url:
        url: "https://maven.neoforged.net/releases/net/neoforged/neoforge/{{ neoforge_ver }}/neoforge-{{ neoforge_ver }}-installer.jar"
        dest: "{{ mc_root_dir }}/data/neoforge-installer.jar"
        mode: '0755'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Run NeoForge Manual Installer
      ansible.builtin.command:
        cmd: "java -jar neoforge-installer.jar --installServer"
        chdir: "{{ mc_root_dir }}/data"
      become_user: "{{ ansible_user }}"
      args:
        creates: "{{ mc_root_dir }}/data/libraries"

    # --- GOLDEN IMAGE MOD SYNC ---
    - name: Sync Mods from Golden Image (Arch Machine)
      ansible.posix.synchronize:
        src: /home/daniel/server-golden-image/mods/
        dest: "{{ mc_root_dir }}/data/mods/"
        delete: true
        recursive: true
        rsync_opts:
          - "--archive"
          - "--no-owner"
          - "--no-group"

    - name: Sync KubeJS Scripts from Golden Image (Arch Machine)
      ansible.posix.synchronize:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        delete: true
        recursive: true
        rsync_opts:
          - "--archive"
          - "--no-owner"
          - "--no-group"
      loop:
        - src: "/home/daniel/server-golden-image/kubejs-scripts/server_scripts/"
          dest: "{{ mc_root_dir }}/data/kubejs/server_scripts/"
        - src: "/home/daniel/server-golden-image/kubejs-scripts/startup_scripts/"
          dest: "{{ mc_root_dir }}/data/kubejs/startup_scripts/"
      loop_control:
        label: "{{ item.dest }}"

    - name: Sync Config Files from Golden Image (Arch Machine)
      ansible.posix.synchronize:
        src: "{{ item }}"
        dest: "{{ mc_root_dir }}/data/config/"
        rsync_opts:
          - "--archive"
          - "--no-owner"
          - "--no-group"
      loop: "{{ query('ansible.builtin.fileglob', '/home/daniel/server-golden-image/configs/*') }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Deploy Docker Compose File
      ansible.builtin.template:
        src: templates/minecraft-compose.yml.j2
        dest: "{{ mc_root_dir }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      no_log: true

    - name: Fix permissions recursively
      ansible.builtin.file:
        path: "{{ mc_root_dir }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true

    - name: Create Cron Scripts Directory
      ansible.builtin.file:
        path: "{{ mc_root_dir }}/cron-scripts"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Deploy Restic Backup Script
      ansible.builtin.copy:
        dest: "{{ mc_root_dir }}/cron-scripts/backup.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
        content: |
          #!/bin/bash
          if ! docker ps >/dev/null 2>&1; then
            exec sg docker -c "/bin/bash $0 $@"
          fi
          source /home/{{ ansible_user }}/.profile
          export RESTIC_PASSWORD="{{ restic_pw }}"
          export RESTIC_REPOSITORY="{{ restic_repo }}"
          echo "Starting backup at $(date)" >> {{ mc_root_dir }}/backup.log
          docker exec -i minecraft-java rcon-cli save-all
          docker exec -i minecraft-java rcon-cli save-off
          restic {{ sftp_args }} backup {{ mc_root_dir }}/data/ --tag automated --quiet
          docker exec -i minecraft-java rcon-cli save-on
          echo "Backup Complete at $(date)" >> {{ mc_root_dir }}/backup.log
      no_log: true

    - name: Deploy Maintenance Script
      ansible.builtin.copy:
        dest: "{{ mc_root_dir }}/cron-scripts/maintenance.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
        content: |
          #!/bin/bash
          if ! docker ps >/dev/null 2>&1; then
            exec sg docker -c "/bin/bash $0 $@"
          fi
          source /home/{{ ansible_user }}/.profile
          export RESTIC_PASSWORD="{{ restic_pw }}"
          export RESTIC_REPOSITORY="{{ restic_repo }}"
          echo "Starting Daily Maintenance at $(date)..." >> {{ mc_root_dir }}/backup.log
          restic {{ sftp_args }} forget --keep-hourly 48 --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --keep-yearly 2 --keep-tag checkpoint --prune --quiet
          echo "Maintenance Complete." >> {{ mc_root_dir }}/backup.log
      no_log: true

    - name: Deploy Permanent Checkpoint Script
      ansible.builtin.copy:
        dest: "{{ mc_root_dir }}/checkpoint.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
        content: |
          #!/bin/bash
          if ! docker ps >/dev/null 2>&1; then
            exec sg docker -c "/bin/bash $0 $@"
          fi
          source /home/{{ ansible_user }}/.profile
          export RESTIC_PASSWORD="{{ restic_pw }}"
          export RESTIC_REPOSITORY="{{ restic_repo }}"
          echo "=== CREATE PERMANENT CHECKPOINT ==="
          read -p "Enter a name for this checkpoint: " USER_TAG
          SAFE_TAG=$(echo "$USER_TAG" | tr -s ' ' '_' | tr -cd '[:alnum:]_-')
          if [ -z "$SAFE_TAG" ]; then echo "Invalid name."; exit 1; fi
          docker exec -i minecraft-java rcon-cli save-all
          docker exec -i minecraft-java rcon-cli save-off
          restic {{ sftp_args }} backup {{ mc_root_dir }}/data/ --tag checkpoint --tag "$SAFE_TAG" --quiet
          docker exec -i minecraft-java rcon-cli save-on
          echo "Checkpoint '$SAFE_TAG' saved."
      no_log: true

    - name: Deploy Interactive Restic Restore Script
      ansible.builtin.copy:
        dest: "{{ mc_root_dir }}/restore.sh"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
        content: |
          #!/bin/bash
          if ! docker ps >/dev/null 2>&1; then
            exec sg docker -c "/bin/bash $0 $@"
          fi
          export RESTIC_PASSWORD="{{ restic_pw }}"
          echo "--- Available Restore Points ---"
          restic {{ sftp_args }} -r {{ restic_repo }} snapshots
          echo ""
          read -p "Enter Snapshot ID to restore (or Enter for 'latest'): " SNAP_ID
          SNAP_ID=${SNAP_ID:-latest}
          read -p "Are you sure? (y/N): " CONFIRM
          if [[ "$CONFIRM" != "y" ]]; then echo "Aborted."; exit 1; fi
          cd {{ mc_root_dir }} && docker compose stop
          restic {{ sftp_args }} -r {{ restic_repo }} restore $SNAP_ID --target / --verify
          docker compose start
      no_log: true

    - name: Schedule Hourly Backup
      ansible.builtin.cron:
        name: "Minecraft Restic Backup"
        minute: "0"
        user: "{{ ansible_user }}"
        job: "/bin/bash {{ mc_root_dir }}/cron-scripts/backup.sh"

    - name: Schedule Daily Maintenance
      ansible.builtin.cron:
        name: "Minecraft Restic Maintenance"
        minute: "0"
        hour: "4"
        user: "{{ ansible_user }}"
        job: "/bin/bash {{ mc_root_dir }}/cron-scripts/maintenance.sh"

    - name: Start Minecraft Server (Docker Compose)
      community.docker.docker_compose_v2:
        project_src: "{{ mc_root_dir }}"
        state: present
        pull: always
        recreate: always
      register: output
