---
- name: Deploy Float Sniper
  hosts: microservice_host
  become: true

  vars:
    float_sniper_remote_path: /opt/float-sniper
    float_sniper_local_path: /home/daniel/lab/float-sniper/
    float_sniper_lock_file: /opt/float-sniper/.deploy.lock
    float_sniper_seed_db_path: /tmp/float-sniper-seed-deals.db
    float_sniper_local_deal_db_path: /home/daniel/lab/float-sniper/deals/deals.db
    float_sniper_seed_database: false
    float_sniper_validate_telegram: false
    float_sniper_docker_volume: float-sniper_deal-data

  tasks:
    - name: Install host packages required by Float Sniper
      ansible.builtin.apt:
        update_cache: true
        name:
          - rsync
          - sqlite3
          - util-linux
        state: present

    - name: Create Float Sniper directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - "{{ float_sniper_remote_path }}"
        - "{{ float_sniper_remote_path }}/logs"

    - name: Create Float Sniper deploy lock file
      ansible.builtin.file:
        path: "{{ float_sniper_lock_file }}"
        state: touch
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Ensure Float Sniper deal database volume exists
      ansible.builtin.command:
        cmd: "docker volume create {{ float_sniper_docker_volume }}"
      register: float_sniper_volume_create
      changed_when: false

    - name: Check whether remote deal database already exists
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          -v {{ float_sniper_docker_volume }}:/data:ro
          alpine:3.20
          sh -c 'test -f /data/deals.db'
      register: float_sniper_remote_db
      changed_when: false
      failed_when: false

    - name: Create local SQLite deal database seed backup when explicitly requested
      ansible.builtin.shell: |
        rm -f {{ float_sniper_seed_db_path }}
        sqlite3 {{ float_sniper_local_deal_db_path }} ".backup '{{ float_sniper_seed_db_path }}'"
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: true
      when:
        - float_sniper_seed_database | bool
        - float_sniper_remote_db.rc != 0

    - name: Copy Float Sniper deal database seed to VM when explicitly requested
      ansible.builtin.copy:
        src: "{{ float_sniper_seed_db_path }}"
        dest: "{{ float_sniper_seed_db_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      when:
        - float_sniper_seed_database | bool
        - float_sniper_remote_db.rc != 0

    - name: Seed deal database volume from local backup when explicitly requested
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          -v {{ float_sniper_docker_volume }}:/data
          -v {{ float_sniper_seed_db_path }}:/seed/deals.db:ro
          alpine:3.20
          sh -c 'cp /seed/deals.db /data/deals.db && chown 65532:65532 /data/deals.db && chmod 0644 /data/deals.db'
      changed_when: true
      when:
        - float_sniper_seed_database | bool
        - float_sniper_remote_db.rc != 0

    - name: Remove local SQLite deal database seed backup
      ansible.builtin.file:
        path: "{{ float_sniper_seed_db_path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false
      when:
        - float_sniper_seed_database | bool
        - float_sniper_remote_db.rc != 0

    - name: Remove remote SQLite deal database seed backup
      ansible.builtin.file:
        path: "{{ float_sniper_seed_db_path }}"
        state: absent
      changed_when: false
      when:
        - float_sniper_seed_database | bool
        - float_sniper_remote_db.rc != 0

    - name: Ship Float Sniper code to VM
      ansible.posix.synchronize:
        src: "{{ float_sniper_local_path }}"
        dest: "{{ float_sniper_remote_path }}"
        delete: true
        recursive: true
        rsync_path: "flock {{ float_sniper_lock_file }} rsync"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=.deploy.lock"
          - "--exclude=.pytest_cache"
          - "--exclude=/deals"
          - "--exclude=logs"

    - name: Copy Float Sniper environment file
      ansible.builtin.copy:
        src: "{{ float_sniper_local_path }}.env"
        dest: "{{ float_sniper_remote_path }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      no_log: true

    - name: Build Float Sniper Docker image under deploy lock
      ansible.builtin.shell: |
        flock {{ float_sniper_lock_file }} bash -lc 'cd {{ float_sniper_remote_path }} && docker compose build float-sniper'
      args:
        executable: /bin/bash
      changed_when: true

    - name: Validate Float Sniper Telegram config under deploy lock
      ansible.builtin.shell: |
        flock {{ float_sniper_lock_file }} bash -lc 'cd {{ float_sniper_remote_path }} && docker compose run --rm -e TELEGRAM_TEST_MESSAGE=true float-sniper'
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true
      when: float_sniper_validate_telegram | bool

    - name: Install Float Sniper systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/float-sniper.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Float Sniper
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ ansible_user }}
          WorkingDirectory={{ float_sniper_remote_path }}
          ExecStart=/usr/bin/docker compose up --no-build float-sniper
          ExecStop=/usr/bin/docker compose down --timeout 30
          TimeoutStopSec=45
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target

    - name: Enable and restart Float Sniper service
      ansible.builtin.systemd:
        name: float-sniper.service
        enabled: true
        state: restarted
        daemon_reload: true
