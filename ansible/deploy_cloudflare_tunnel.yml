---
- name: Deploy Cloudflare Tunnel Connector Service
  hosts: cloudflare_tunnel
  become: true

  pre_tasks:
    - name: Load secret variables
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files:
            - vault.yml
            - env.yml
          paths:
            - "{{ playbook_dir }}"
      no_log: true

    - name: Validate required tunnel token
      ansible.builtin.assert:
        that:
          - cloudflare_tunnel_token is defined
          - cloudflare_tunnel_token | length > 0
        fail_msg: >-
          Define cloudflare_tunnel_token in vault.yml or env.yml.
          This token can be copied from Cloudflare Zero Trust tunnel settings.

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create keyring directory
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Add Cloudflare package signing key
      ansible.builtin.get_url:
        url: https://pkg.cloudflare.com/cloudflare-public-v2.gpg
        dest: /usr/share/keyrings/cloudflare-public-v2.gpg
        mode: '0644'

    - name: Add Cloudflare cloudflared apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloudflare-public-v2.gpg] https://pkg.cloudflare.com/cloudflared any main"
        state: present
        filename: cloudflared

    - name: Install cloudflared
      ansible.builtin.apt:
        name: cloudflared
        state: present
        update_cache: true

    - name: Check whether cloudflared service unit exists
      ansible.builtin.stat:
        path: /etc/systemd/system/cloudflared.service
      register: cloudflared_service_unit

    - name: Install cloudflared system service with tunnel token
      ansible.builtin.command:
        cmd: "cloudflared service install {{ cloudflare_tunnel_token }}"
      when: not cloudflared_service_unit.stat.exists
      changed_when: true
      no_log: true

    - name: Ensure tunnel token is stored in /etc/default/cloudflared
      ansible.builtin.lineinfile:
        path: /etc/default/cloudflared
        regexp: '^TUNNEL_TOKEN='
        line: "TUNNEL_TOKEN={{ cloudflare_tunnel_token }}"
        create: true
        owner: root
        group: root
        mode: '0600'
      notify: Restart cloudflared
      no_log: true

    - name: Enable and start cloudflared
      ansible.builtin.systemd:
        name: cloudflared
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify cloudflared service is active
      ansible.builtin.command:
        cmd: systemctl is-active cloudflared
      register: cloudflared_status
      changed_when: false
      failed_when: cloudflared_status.stdout != "active"

    - name: Print deployment summary
      ansible.builtin.debug:
        msg:
          - "cloudflared service state: {{ cloudflared_status.stdout }}"
          - "Tunnel token source: /etc/default/cloudflared"

  handlers:
    - name: Restart cloudflared
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted
        daemon_reload: true
