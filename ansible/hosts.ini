[microservice_vm]
microservice-host

[tailscale_lxc]
vpn-gateway

[cloudflare_lxc]
cloudflare-tunnel

[game_server]
game-server

# Meta-group containing all hosts
# -----------------------------------------------------------------------------
[all:children]
