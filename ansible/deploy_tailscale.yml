---
- name: Deploy Tailscale Native Subnet Router and Harden Firewall
  hosts: vpn_gateway
  become: true

  pre_tasks:
    - name: Load secret variables
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files:
            - vault.yml
            - env.yml
          paths:
            - "{{ playbook_dir }}"
      no_log: true

  tasks:
    - name: Enable IPv4 forwarding in the kernel
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - curl
          - ufw
        state: present
        update_cache: true

    - name: Create keyring directory
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'

    - name: Add Tailscale repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main"
        state: present
        filename: tailscale

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: UFW - Allow SSH from local network
      community.general.ufw:
        rule: allow
        src: 192.168.1.0/24
        port: '22'
        proto: tcp

    - name: UFW - Allow all traffic from Tailscale interface
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in

    - name: UFW - Allow routing from Tailscale to local network
      community.general.ufw:
        rule: allow
        route: true
        direction: in
        interface: tailscale0
        dest: 192.168.1.0/24

    - name: UFW - Enable firewall and set default deny
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Check Tailscale login status
      ansible.builtin.command: tailscale status --json
      register: ts_status
      failed_when: false
      changed_when: false

    - name: Bring Tailscale Up
      ansible.builtin.command:
        cmd: >
          tailscale up
          --reset
          --authkey={{ ts_key }}
          --hostname="lxc-subnet-router"
          --advertise-routes="192.168.1.0/24"
          --accept-dns=false
      when: "'Running' not in (ts_status.stdout | from_json).BackendState"
      changed_when: true
      no_log: true
