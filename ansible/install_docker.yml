---
- name: Install Docker on Workload VMs
  hosts: workloads
  become: true
  tasks:
    - name: Update apt cache and install dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        # FIXED: Use ansible_facts['distribution'] instead of ansible_distribution
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: Add Docker repository to Apt sources
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ARCH=$(dpkg --print-architecture)
          # FIXED: Use ansible_facts['distribution']
          OS_DIST="{{ ansible_facts['distribution'] | lower }}"
          OS_VER=$(. /etc/os-release && echo "$VERSION_CODENAME")
          KEY="/etc/apt/keyrings/docker.asc"
          REPO="https://download.docker.com/linux/$OS_DIST"

          ENTRY="deb [arch=$ARCH signed-by=$KEY] $REPO $OS_VER stable"
          echo "$ENTRY" | tee /etc/apt/sources.list.d/docker.list > /dev/null
        creates: /etc/apt/sources.list.d/docker.list
        executable: /bin/bash

    - name: Install Docker Engine
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add current user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Install Docker Python SDK
      ansible.builtin.apt:
        name: python3-docker
        state: present
