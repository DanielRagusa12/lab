---
- name: Stage a removable browser-worker restrictions profile
  hosts: macos
  gather_facts: true
  become: false

  # Stages only. Profile approval and removal happen through VNC/System Settings.
  # Run as the normal SSH user, not root; no package or utility installation.
  vars:
    mac_browser_profile_path: "{{ ansible_facts.user_dir }}/Downloads/Homelab-browser-worker.mobileconfig"

  tasks:
    - name: Require the reviewed macOS version family
      ansible.builtin.assert:
        that:
          - ansible_facts.system == 'Darwin'
          - ansible_facts.distribution_version is version('27.0', '>=')
          - ansible_facts.distribution_version is version('28.0', '<')
          - ansible_facts.user_id != 'root'
        fail_msg: This profile was reviewed for macOS 27 and must be staged as the normal user.

    - name: Read System Integrity Protection status
      ansible.builtin.command: /usr/bin/csrutil status
      register: mac_profile_sip
      changed_when: false
      check_mode: false

    - name: Require System Integrity Protection to remain enabled
      ansible.builtin.assert:
        that: "'System Integrity Protection status: enabled.' in mac_profile_sip.stdout"
        fail_msg: SIP is not fully enabled. Review locally before proceeding.

    - name: Ensure the user Downloads directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/Downloads"
        state: directory
        # Do not change permissions on an existing user directory.

    - name: Stage and validate the profile without installing it
      ansible.builtin.copy:
        src: files/mac-browser-worker.mobileconfig
        dest: "{{ mac_browser_profile_path }}"
        mode: '0600'
        backup: true
        validate: /usr/bin/plutil -lint %s

    - name: Explain manual approval and rollback
      ansible.builtin.debug:
        msg:
          - "Staged only: {{ mac_browser_profile_path }}"
          - Through VNC, open this file in Finder and approve Homelab browser worker in System Settings > General > Device Management.
          - The profile is unsigned because it is generated by this repository; inspect its contents before approval.
          - Confirm the restrictions in System Settings after approval; staging is not proof they are active.
          - Siri/AI restriction keys are deprecated by Apple since macOS 26.4. Review their effectiveness after upgrades.
          - No global Apple Intelligence switch is forced. Automatic Mail summaries and other unlisted features may remain enabled.
          - If desired, also turn Apple Intelligence off using its supported System Settings toggle.
          - MLX, Metal, model files, download servers, SSH/VNC, SIP, FileVault, and software updates are unchanged.
          - To undo, remove Homelab browser worker from Device Management. Removing the staged file alone does not uninstall it.
